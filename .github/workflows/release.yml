name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        # release-please opens/updates a Release PR with the generated
        # CHANGELOG on every push to main; merging that PR tags vX.Y.Z and
        # publishes the GitHub Release that triggers the smoke workflow.
